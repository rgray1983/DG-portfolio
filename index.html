<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Richie – Portfolio</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React and ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html,body { height: 100%; margin: 0; }
    html { scroll-behavior: smooth; }
    .modal-backdrop { background: rgba(0,0,0,0.65); }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [selected, setSelected] = useState(null);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [resumeOpen, setResumeOpen] = useState(false);

      // which project is active in the Selected Work carousel
      const [activeProjectIndex, setActiveProjectIndex] = useState(0);
      // which image is showing in the thumbnail carousel
      const [thumbIndex, setThumbIndex] = useState(0);

      const projects = [
        {
          id: 1,
          title: "Brand Identity",
          subtitle: "Logo, visual identity, and packaging",
          images: [
            "https://i.imgur.com/s9FyiEt.jpg",
            "https://i.imgur.com/Cz91Ew3.jpg",
            "https://i.imgur.com/oAAsl74.jpg",
            "https://i.imgur.com/8p2ihGy.jpg",
            "https://i.imgur.com/lC8whwv.jpg",
            "https://i.imgur.com/TtIYM53.jpg",
            "https://i.imgur.com/ssbSEwh.jpg",
            "https://i.imgur.com/Ne3sEEe.jpg",
            "https://i.imgur.com/tVCtVhn.jpg",
            "https://i.imgur.com/jDFMhMF.jpg"
          ],
          desc: "A selection of identity systems, logo marks, and supporting visual assets that help brands feel cohesive and memorable across print and digital."
        },
        {
          id: 2,
          title: "Packaging Design",
          subtitle: "Corrugated, retail, and specialty packaging",
          images: [
            "https://i.imgur.com/adKEq9K.jpg",
            "https://i.imgur.com/GeJrXWp.jpg",
            "https://i.imgur.com/T0tyAag.jpg",
            "https://i.imgur.com/thILgkh.jpg",
            "https://i.imgur.com/jW001UK.jpg",
            "https://i.imgur.com/u6unTby.jpg",
            "https://i.imgur.com/XyKUHe2.jpg",
            "https://i.imgur.com/E9h7Qik.jpg",
            "https://i.imgur.com/WMxj9vW.jpg",
            "https://i.imgur.com/ViSRl8p.jpg"
          ],
          desc: "Award-winning corrugated and retail packaging, built to balance structure, print constraints, and strong shelf presence."
        }
      ];

      const activeProject = projects[activeProjectIndex];

      const openProject = (project, index) => {
        setSelected(project);
        setCurrentIndex(index ?? 0);
      };

      const prevImage = () => {
        if (!selected) return;
        setCurrentIndex((currentIndex - 1 + selected.images.length) % selected.images.length);
      };

      const nextImage = () => {
        if (!selected) return;
        setCurrentIndex((currentIndex + 1) % selected.images.length);
      };

      // project-level carousel controls
      const prevProject = () => {
        const nextIndex = (activeProjectIndex - 1 + projects.length) % projects.length;
        setActiveProjectIndex(nextIndex);
        setThumbIndex(0); // reset to first image of the new project
      };

      const nextProject = () => {
        const nextIndex = (activeProjectIndex + 1) % projects.length;
        setActiveProjectIndex(nextIndex);
        setThumbIndex(0); // reset to first image of the new project
      };

      // image-level carousel controls inside the thumbnail area
      const prevThumb = () => {
        setThumbIndex((prev) => (prev - 1 + activeProject.images.length) % activeProject.images.length);
      };

      const nextThumb = () => {
        setThumbIndex((prev) => (prev + 1) % activeProject.images.length);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* NAV */}
          <header className="sticky top-0 z-30 bg-slate-950/95 backdrop-blur border-b border-slate-800">
            <div className="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
              <a href="#" className="flex items-center gap-2 font-semibold tracking-tight">
                {/* Replace this text with your logo image if you want: */}
                <img src="https://imgur.com/bNX4BKZ.png" alt="Richie Logo" className="h-9 w-auto" />
                <span>Richie Gray's Portfolio</span> 
              </a>
              <nav className="hidden sm:flex items-center gap-6 text-sm text-slate-200">
                <a href="#work" className="hover:text-slate-100 transition">Work</a>
                <a href="#about" className="hover:text-slate-100 transition">About</a>
                <a href="#contact" className="hover:text-slate-100 transition">Contact</a>
                <button
                  onClick={() => setResumeOpen(true)}
                  className="ml-4 rounded-full border border-slate-600 px-4 py-1.5 text-xs font-medium hover:bg-slate-100 hover:text-slate-900 transition"
                >
                  View Resume
                </button>
              </nav>
              {/* Mobile resume button */}
              <button
                onClick={() => setResumeOpen(true)}
                className="sm:hidden rounded-full border border-slate-600 px-3 py-1 text-xs font-medium hover:bg-slate-100 hover:text-slate-900 transition"
              >
                Resume
              </button>
            </div>
          </header>

          <main className="flex-1">
            {/* HERO */}

              <div className="max-w-5xl mx-auto px-4 py-16 md:py-24 grid md:grid-cols-[1.3fr,1fr] gap-10 items-center">
                {/* Headshot first on mobile, second on desktop */}
                <div className="order-1 md:order-2 flex justify-center mb-8 md:mb-0">
                  <div className="w-40 h-40 md:w-52 md:h-52 rounded-full overflow-hidden border border-slate-700 bg-slate-900 shadow-md flex items-center justify-center">
                    <img
                      src="https://imgur.com/O9YXhyP.jpg"
                      alt="Richie headshot"
                      className="w-full h-full object-cover"
                    />
                  </div>
                </div>

                {/* Text second on mobile, first on desktop */}
                <div className="order-2 md:order-1">
                  <p className="uppercase tracking-[0.2em] text-xs text-slate-400 mb-4">
                    Graphic Design & Brand Marketing
                  </p>
                  <h1 className="text-3xl sm:text-4xl md:text-5xl font-semibold tracking-tight mb-4">
                    Hi, I’m <span className="text-red-400">Richie</span>.
                  </h1>
                  <p className="text-base sm:text-lg text-slate-300 mb-6 leading-relaxed">
                    Design that drives growth. Branding that builds loyalty. Creativity that gets results.
                  </p>
                  <div className="flex flex-wrap gap-3">
                    <a
                      href="#work"
                      className="inline-flex items-center justify-center rounded-full bg-slate-100 text-slate-900 px-6 py-2 text-sm font-medium hover:bg-white transition"

                      View Selected Work
                    </a>
                    <a
                      href="#contact"
                      className="inline-flex items-center justify-center rounded-full border border-slate-600 px-6 py-2 text-sm font-medium hover:bg-slate-800 transition"
                    >
                      Let’s Work Together
                    </a>
                  </div>
                </div>
              </div>
            </section>

            {/* WORK / PORTFOLIO – project carousel + thumbnail image carousel */}
            <section id="work" className="border-b border-slate-800 bg-slate-900">

                  <div className="flex items-center gap-3 text-xs text-slate-400">
                    <span>{activeProjectIndex + 1} / {projects.length}</span>
                    <div className="flex gap-1">
                      <button

                        aria-label="Previous project"
                      >
                        ◀
                      </button>
                      <button
                        onClick={nextProject}
                        className="h-7 w-7 flex items-center justify-center rounded-full border border-slate-600 hover:bg-slate-800 hover:text-slate-100 transition"
                        aria-label="Next project"
                      >
                        ▶
                      </button>
                    </div>
                  </div>
                </div>

                <article className="grid md:grid-cols-[1.4fr,1fr] gap-6 md:gap-10 items-start">
                  {/* Thumbnail carousel area */}
                  <div
                    className="space-y-4 cursor-pointer"
                    onClick={() => openProject(activeProject, thumbIndex)}
                  >
                    <div className="relative rounded-2xl overflow-hidden border border-slate-800 bg-slate-800">
                      <img
                        src={activeProject.images[thumbIndex]}
                        alt={activeProject.title}
                        className="w-full h-56 sm:h-72 object-cover"
                      />
                      {/* subtle overlay gradient */}
                      <div className="absolute inset-0 bg-gradient-to-t from-slate-950/40 via-transparent to-transparent pointer-events-none" />
                      {/* Small arrows inside the thumbnail area */}
                      <button
                        onClick={(e) => { e.stopPropagation(); prevThumb(); }}
                        className="absolute top-1/2 left-3 -translate-y-1/2 bg-black/50 text-white w-8 h-8 flex items-center justify-center rounded-full text-sm hover:bg-black/70 transition"
                        aria-label="Previous image"
                      >
                        ◀
                      </button>
                      <button
                        onClick={(e) => { e.stopPropagation(); nextThumb(); }}
                        className="absolute top-1/2 right-3 -translate-y-1/2 bg-black/50 text-white w-8 h-8 flex items-center justify-center rounded-full text-sm hover:bg-black/70 transition"
                        aria-label="Next image"
                      >
                        ▶
                      </button>
                      {/* Small index indicator */}
                      <div className="absolute bottom-3 right-4 text-xs px-2 py-0.5 rounded-full bg-black/60 text-slate-100">
                        {thumbIndex + 1} / {activeProject.images.length}
                      </div>
                    </div>
                  </div>

                  {/* Text area */}
                  <div className="space-y-3">
                    <h3 className="text-xl sm:text-2xl font-semibold tracking-tight text-slate-50">
                      {activeProject.title}
                    </h3>
                    {activeProject.subtitle && (
                      <p className="text-sm uppercase tracking-[0.18em] text-slate-400">

                      </p>
                    )}
                    <p className="text-sm sm:text-base text-slate-300 leading-relaxed">
                      {activeProject.desc}
                    </p>
                    <button
                      onClick={() => openProject(activeProject, thumbIndex)}

                    >
                      View project images
                      <span className="ml-1">↗</span>
                    </button>
                  </div>
                </article>
              </div>
            </section>

            {/* ABOUT */}
            <section id="about" className="border-b border-slate-800 bg-slate-950">
              <div className="max-w-5xl mx-auto px-4 py-16 md:py-20 grid md:grid-cols-2 gap-10 items-start">
                <div>
                  <h2 className="text-2xl sm:text-3xl font-semibold tracking-tight mb-4 text-slate-50">

                  </h2>
                  <p className="text-base sm:text-lg text-slate-300 mb-4 leading-relaxed">
                    I’m a brand builder, logo-obsessed designer, and creative problem-solver with a passion for turning big ideas into visuals people actually remember. I’ve spent over 20 years helping businesses stand out with bold identities, strong storytelling, and design that makes people stop and say, “Whoa… who 					made that?”
				  </p>
				  <p className="text-base sm:text-lg text-slate-300 mb-4 leading-relaxed">

				  </p>
				  <p className="text-base sm:text-lg text-slate-300 mb-4 leading-relaxed">	
					When I’m not designing, you’ll probably find me hanging with my wife and daughters, editing YouTube videos, gaming with friends, or building wild creative ideas just for fun.
				  </p>	
				  <p className="text-base sm:text-lg text-slate-300 mb-4 leading-relaxed">	
					If you’re looking for a designer who brings high energy, real passion, and zero boring design, we’re definitely going to get along great.
                  </p>
                </div>
                {/* RIGHT COLUMN: Family photo */}
                <div className="flex justify-center md:justify-center">
                  <div className="rounded-2xl overflow-hidden border border-slate-800 bg-slate-900 shadow-md w-100 h-100 sm:w-150 sm:h-150 flex items-center md:justify-center">
                    <img
                      src="https://imgur.com/7rnCSDu.jpg"

                      className="w-full h-full object-cover"
                    />
                    {/* Replace the src above with your actual family photo URL */}
                  </div>
                </div>
              </div>
            </section>

            {/* SKILLS + CONTACT */}

              <div className="max-w-5xl mx-auto px-4 py-16 md:py-20 grid md:grid-cols-[1.4fr,1fr] gap-12 items-start">

                  </h2>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    {[
                      "CorelDraw",

                      "Photoshop",

                      "Design Concepts",

                    ].map((skill) => (

                  </div>
                </div>

                {/* Contact */}
                <div className="space-y-4">
                  <h2 className="text-2xl sm:text-3xl font-semibold tracking-tight text-slate-50">
                    Let’s Work Together.
                  </h2>
                  <p className="text-sm sm:text-base text-slate-300 leading-relaxed">

                      </a>
                    </p>
                  </div>
                </div>
              </div>
            </section>
          </main>

          {/* FOOTER */}
          <footer className="border-t border-slate-800 bg-slate-950">
            <div className="max-w-5xl mx-auto px-4 py-6 flex flex-col sm:flex-row items-center justify-between gap-2 text-sm text-slate-500">
              <span>© {new Date().getFullYear()} Richie Gray. All rights reserved.</span>
              <div className="flex gap-4 text-lg">
                <a href="mailto:rgray1983@gmail.com" aria-label="email" className="hover:text-slate-200">📧</a>
                <a href="tel:8434532282" aria-label="phone" className="hover:text-slate-200">📞</a>
                <a href="https://www.linkedin.com/in/drgdesign/" aria-label="linkedin" className="hover:text-slate-200">🔗</a>
              </div>
            </div>
          </footer>

          {/* PROJECT MODAL */}
          {selected && (
            <div className="fixed inset-0 z-50 flex items-center justify-center px-2 sm:px-4">
              <div className="absolute inset-0 modal-backdrop" onClick={() => setSelected(null)} />
              <div className="relative rounded-2xl bg-slate-950 text-slate-50 max-w-[90vw] max-h-[90vh] mx-2 sm:mx-4 flex flex-col items-center p-4 overflow-auto shadow-xl border border-slate-800">
                <div className="relative w-full flex justify-center items-center">
                  <img
                    src={selected.images[currentIndex]}
                    alt={selected.title}
                    className="max-w-[100%] max-h-[80vh] rounded-lg object-contain"
                  />
                  <button
                    onClick={prevImage}
                    className="absolute top-1/2 left-2 -translate-y-1/2 bg-black/60 text-white px-3 py-1 rounded text-xl sm:text-2xl"
                  >

                  </button>
                  <button
