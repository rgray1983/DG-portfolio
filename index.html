<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Richie – Portfolio</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React and ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html,body { height: 100%; margin: 0; }
    html { scroll-behavior: smooth; }
    .parallax-layer { position: absolute; inset: 0; background-position: center; background-repeat: no-repeat; background-size: cover; }
    .modal-backdrop { background: rgba(0,0,0,0.65); }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-black via-blue-900 to-red-900 text-white font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [selected, setSelected] = useState(null);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [resumeOpen, setResumeOpen] = useState(false);
      const [y, setY] = useState(0);

      useEffect(() => {
        const onScroll = () => setY(window.scrollY || 0);
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const projects = [
        {

            "https://i.imgur.com/s9FyiEt.jpg",
            "https://i.imgur.com/Cz91Ew3.jpg",
            "https://i.imgur.com/oAAsl74.jpg",
            "https://i.imgur.com/8p2ihGy.jpg",
            "https://i.imgur.com/lC8whwv.jpg",
            "https://i.imgur.com/TtIYM53.jpg",
            "https://i.imgur.com/ssbSEwh.jpg",
            "https://i.imgur.com/Ne3sEEe.jpg",
            "https://i.imgur.com/tVCtVhn.jpg",
            "https://i.imgur.com/jDFMhMF.jpg"
          ],
          desc: "Logo and visual identity showcase."
        },
        {
          id: 2,
          title: "Packaging Design",
          images: [
            "https://i.imgur.com/adKEq9K.jpg",
            "https://i.imgur.com/GeJrXWp.jpg",
            "https://i.imgur.com/T0tyAag.jpg",
            "https://i.imgur.com/thILgkh.jpg",
            "https://i.imgur.com/jW001UK.jpg",
            "https://i.imgur.com/u6unTby.jpg",
            "https://i.imgur.com/XyKUHe2.jpg",
            "https://i.imgur.com/E9h7Qik.jpg",
            "https://i.imgur.com/WMxj9vW.jpg",
            "https://i.imgur.com/ViSRl8p.jpg"
          ],
          desc: "Creative box design."
        }
      ];

      const t1 = `translateY(${y * 0.12}px)`;

      return (
        <div className='min-h-screen text-white'>

          {/* HERO */}
          <header className="relative h-screen flex items-center justify-center text-center overflow-hidden px-4">
            <div className="parallax-layer" style={{transform: t1, backgroundImage: "url('https://picsum.photos/id/119/1600/900')", opacity: 0.35}} />
            <div className="relative z-10 space-y-4">
              <h1 className="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-extrabold mb-4 inline-block">Hi, I'm <span className="text-red-400">Richie</span></h1>

                    className="max-w-[100%] max-h-[80vh] rounded-lg object-contain"

                  <button onClick={() => setCurrentIndex((currentIndex + 1) % selected.images.length)} className="absolute top-1/2 right-2 -translate-y-1/2 bg-black/40 text-white px-3 py-1 rounded text-xl sm:text-2xl">▶</button>
                </div>
                <h3 className="text-xl sm:text-2xl font-bold mb-2 mt-4">{selected.title}</h3>
                <p className="mb-4 text-gray-700">{selected.desc}</p>
                <div className="flex justify-end w-full">
                  <button onClick={() => setSelected(null)} className="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white">Close</button>
                </div>
              </div>
            </div>

                    <li>Designed a new brochure and responsive website (HTML5 & CSS3)</li>
                    <li>Worked with salesmen and customers to ensure highest design quality</li>
                    <li>Entered designs into AICC and TAPPI competitions; won multiple awards including 1st and 2nd place and “People’s Choice” awards</li>
                  </ul>

                  <p className="font-semibold mt-2">Sr. Graphic Designer/Pre-Production Artist</p>
                  <p>Carolina Printing, Sports, and Trophy - Hartsville, SC - Aug 2010 - Mar 2015</p>
                  <ul className="list-disc list-inside ml-4">
                    <li>Designed artwork for t-shirts, signs, banners, business cards, decals</li>
                    <li>Produced 20–30 different designs weekly, totaling over 6,000 designs in 5 years</li>
                    <li>Specialized in design and pre-production proofing</li>
                  </ul>

                  <p className="font-semibold mt-2">Graphic Designer/Pre-Production Artist</p>
                  <p>Southern Graphics Systems - McBee, SC - Apr 2009 - Dec 2009</p>
                  <ul className="list-disc list-inside ml-4">
                    <li>Prepared artwork from major brands (KRAFT, Georgia Pacific, Dixie Cups, Panasonic) for printing</li>
                    <li>Worked with corrugated design for product packaging</li>
                    <li>Created Illustrator script to minimize material use in pre-press platemaking, saving thousands of dollars</li>
                  </ul>

                  <p className="font-semibold mt-2">Graphic Designer/Programmer</p>
                  <p>School Dynamics Systems - Hartsville, SC - Jan 2006 - Aug 2006</p>
                  <ul className="list-disc list-inside ml-4">
                    <li>Designed marketing materials (instructional videos, flyers, brochures)</li>
                    <li>Converted software from Microsoft Access to HTML-based, reducing travel and installation costs</li>
                  </ul>

                  <p className="font-semibold mt-2">Graphic Designer/Pre-Production Artist</p>
                  <p>AmeriServ Printers LLC - Hartsville, SC - Jan 2003 - Dec 2005</p>
                  <ul className="list-disc list-inside ml-4">
                    <li>Designed and laid out artwork from invoices to business cards</li>
                    <li>Refined copy-proof processes to reduce costs and improve efficiency</li>
                  </ul>

                  <p className="font-bold mt-4">EDUCATION</p>
                  <p>Graphic Design - Coker College, Hartsville, SC (2002 - 2007)</p>

                  <p className="font-bold mt-4">GROUPS</p>
                  <ul className="list-disc list-inside ml-4">
                    <li>Hartsville Downtown Development Association (HDDA) Design Committee Co-Chair, Jul 2012 - Mar 2015</li>
                    <li>Hartsville Young Professionals Member, Jul 2012 - Mar 2015</li>
                  </ul>
                </div>
              </div>
            </div>
          )}

          {/* Skills + Let’s Work Together Section */}
          <section id="contact" className="py-16 px-4 sm:px-6 bg-black/40 text-center">
            <div className="max-w-6xl mx-auto text-center">
              <h2 className="text-3xl sm:text-4xl font-bold mb-8">Skills</h2>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-3 gap-6 mb-12">
                {[
                  "CorelDraw",
                  "Illustrator",
                  "Photoshop",
                  "Layout Design",
                  "Design Concepts",
                  "Marketing (Digital, Social & Print)",
                  "Pre-Production Management",
                  "Web Development (HTML5 & CSS3)",
                  "Typography & Font Management",
                  "Printing Processes",
                  "ArtiosCad (Limited)",
                  "Corrugated Box Design"
                ].map((skill) => (
                  <div
                    key={skill}
                    className="bg-white/10 p-4 rounded-lg text-white text-base sm:text-lg font-medium"
                  >
                    {skill}
                  </div>
                ))}
              </div>

              <h2 className="text-3xl sm:text-4xl font-bold mb-6">Let’s Work Together!</h2>
              <p className="mb-6 text-gray-300">
                Get in touch via email or socials below:
              </p>
              <div className="flex justify-center gap-6 text-2xl">
                <a href="mailto:rgray1983@gmail.com" className="hover:text-red-400" aria-label="email">📧</a>
                <a href="tel:8434532282" className="hover:text-red-400" aria-label="phone">📞</a>
                <a href="https://www.linkedin.com/in/drgdesign/" className="hover:text-red-400" aria-label="linkedin">🔗</a>
              </div>
            </div>
          </section>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
</html>
