name: Portfolio checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate site structure and assets
        run: node scripts/validate-site.mjs

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
