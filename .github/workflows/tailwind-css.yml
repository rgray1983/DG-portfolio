name: Build Tailwind CSS

on:
  pull_request:
    paths:
      - "index.html"
      - "js/**"
      - "css/tailwind-input.css"
      - "tailwind.config.cjs"
      - "package.json"
      - ".github/workflows/tailwind-css.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Compile Tailwind CSS
        run: npm run build:css

      - name: Commit generated stylesheet
        shell: bash
        run: |
          git add css/tailwind.css
          if git diff --cached --quiet; then
            echo "Compiled stylesheet is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Compile production Tailwind stylesheet"
          git push
